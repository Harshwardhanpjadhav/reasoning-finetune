# Training config — tuned for a single free-tier T4
dataset:
  name: "gsm8k"
  subset: "main"
  split: "train"
  max_seq_length: 1024   # CoT traces are long; keep this modest to stay fast on a T4

training:
  output_dir: "results/checkpoints/gsm8k-lora"
  num_train_epochs: 3
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  warmup_ratio: 0.03
  logging_steps: 10
  save_strategy: "steps"
  save_steps: 100
  save_total_limit: 3
  resume_from_checkpoint: "auto"

wandb:
  project: "reasoning-finetune"
  run_name: "gemma-2-2b-bnb-4bit-lora-CoT-gsm8k"
  tags: ["gemma-2-2b-bnb-4bit", "lora", "gsm8k", "unsloth"]